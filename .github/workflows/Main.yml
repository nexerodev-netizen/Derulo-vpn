name: Update VLESS Aggregator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run VLESS Parser and JSON Generator
        run: |
          cat << 'EOF' > parser.py
          import requests
          import urllib.parse
          import json
          import re
          import uuid

          SOURCES = [
              "https://cdn.jsdelivr.net/gh/luxxuria/harvester@main/ping_tested.txt",
              "https://raw.githubusercontent.com/bobrinaw/vlessforu/refs/heads/main/working_configs.txt"
          ]

          def has_flag_emoji(text):
              return bool(re.search(r'[\U0001F1E6-\U0001F1FF]{2}', text))

          def get_flag_from_name(name):
              match = re.search(r'([\U0001F1E6-\U0001F1FF]{2})', name)
              if match:
                  return match.group(1)
              return "🏳️"

          def parse_vless_to_outbound(line, tag_prefix="proxy"):
              try:
                  # vless://uuid@host:port?params#name
                  if '#' in line:
                      base_part, fragment = line.rsplit('#', 1)
                      original_name = urllib.parse.unquote(fragment)
                  else:
                      return None
                  
                  body = base_part[8:] # remove vless://
                  user_host, _, rest = body.partition('@')
                  uuid_val = user_host
                  host_params, _, _ = rest.partition('#')
                  
                  address_port, _, query_string = host_params.partition('?')
                  address, port = address_port.split(':')
                  port = int(port)
                  
                  params = dict(urllib.parse.parse_qsl(query_string))
                  
                  # Determine security and settings
                  security = params.get('security', 'none')
                  flow = params.get('flow', '')
                  sni = params.get('sni', address)
                  fp = params.get('fp', 'random')
                  
                  outbound = {
                      "tag": f"{tag_prefix}-{original_name}", # Уникальный тег
                      "protocol": "vless",
                      "settings": {
                          "vnext": [
                              {
                                  "address": address,
                                  "port": port,
                                  "users": [
                                      {
                                          "id": uuid_val,
                                          "encryption": "none",
                                          "flow": flow
                                      }
                                  ]
                              }
                          ]
                      },
                      "streamSettings": {
                          "network": params.get('type', 'tcp'),
                          "security": security
                      }
                  }
                  
                  # Add TLS/Reality settings
                  if security == 'reality':
                      outbound["streamSettings"]["realitySettings"] = {
                          "serverName": params.get('sni', ''),
                          "publicKey": params.get('pbk', ''),
                          "shortId": params.get('sid', ''),
                          "fingerprint": fp
                      }
                  elif security == 'tls':
                      outbound["streamSettings"]["tlsSettings"] = {
                          "serverName": sni,
                          "fingerprint": fp
                      }
                      
                  # Add Transport settings
                  net_type = params.get('type', 'tcp')
                  if net_type == 'ws':
                      outbound["streamSettings"]["wsSettings"] = {
                          "path": params.get('path', '/'),
                          "headers": {
                              "Host": params.get('host', '')
                          }
                      }
                  elif net_type == 'grpc':
                      outbound["streamSettings"]["grpcSettings"] = {
                          "serviceName": params.get('serviceName', '')
                      }
                  elif net_type == 'xhttp': # or httpupgrade etc
                       outbound["streamSettings"]["httpSettings"] = {
                          "path": params.get('path', '/'),
                          "host": [params.get('host', '')]
                      }

                  return outbound, original_name
              
              except Exception as e:
                  # print(f"Error parsing: {e}")
                  return None, None

          def process_vless_aggregator():
              normal_outbounds = []
              lte_outbounds = []
              country_map = {} # flag -> list of tags
              
              all_tags_for_balancer = []

              for url in SOURCES:
                  try:
                      response = requests.get(url, timeout=15)
                      response.raise_for_status()
                      lines = response.text.splitlines()
                      
                      for line in lines:
                          line = line.strip()
                          if not line.startswith("vless://"):
                              continue
                          
                          if not has_flag_emoji(line):
                              continue
                              
                          is_lte = "LTE" in line.upper()
                          outbound, original_name = parse_vless_to_outbound(line)
                          
                          if not outbound:
                              continue
                              
                          flag = get_flag_from_name(original_name)
                          
                          # Clean up tag name for readability but keep it unique
                          clean_tag_name = f"{flag} Server"
                          if is_lte:
                              clean_tag_name = f"⚡ LTE {flag}"
                              
                          # Make tag unique by appending a short hash or counter if needed, 
                          # but for balancer selector we need consistent prefixes.
                          # Let's use a simple index to ensure uniqueness in JSON
                          idx = len(normal_outbounds) + len(lte_outbounds)
                          final_tag = f"srv-{idx}-{clean_tag_name.replace(' ', '_')}"
                          outbound["tag"] = final_tag
                          
                          if is_lte:
                              lte_outbounds.append(outbound)
                          else:
                              normal_outbounds.append(outbound)
                              all_tags_for_balancer.append(final_tag)
                              
                              if flag not in country_map:
                                  country_map[flag] = []
                              country_map[flag].append(final_tag)
                              
                  except Exception as e:
                      print(f"Source error: {e}")

              # --- Constructing the Final JSON Structure ---
              
              # 1. Balancer for Auto Select (Normal servers only)
              balancers = [
                  {
                      "tag": "auto-balancer",
                      "selector": ["srv-"], # Selects all tags starting with srv- (normal ones)
                      "strategy": {
                          "type": "leastPing"
                      },
                      "fallbackTag": all_tags_for_balancer[0] if all_tags_for_balancer else "direct"
                  }
              ]
              
              # 2. Routing Rules
              rules = [
                  {
                      "port": "53",
                      "type": "field",
                      "network": "tcp,udp",
                      "outboundTag": "dns-out"
                  },
                  {
                      "type": "field",
                      "ip": ["geoip:private"],
                      "outboundTag": "direct"
                  },
                  {
                      "type": "field",
                      "domain": ["geosite:category-ads-all"],
                      "outboundTag": "block"
                  },
                  {
                      "type": "field",
                      "network": "tcp,udp",
                      "balancerTag": "auto-balancer"
                  }
              ]
              
              # 3. Combine Outbounds
              # Order: Dummy -> Normal Servers -> LTE Servers -> Direct/Block/DNS
              dummy_outbound = {
                  "tag": "dummy",
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{"address": "127.0.0.1", "port": 0, "users": [{"id": str(uuid.uuid4()), "encryption": "none"}]}]
                  },
                  "streamSettings": {"network": "tcp", "security": "none"}
              }
              
              direct_outbound = {"tag": "direct", "protocol": "freedom", "settings": {}}
              block_outbound = {"tag": "block", "protocol": "blackhole", "settings": {}}
              dns_outbound = {"tag": "dns-out", "protocol": "dns", "settings": {}}
              
              final_outbounds = [dummy_outbound] + normal_outbounds + lte_outbounds + [direct_outbound, block_outbound, dns_outbound]
              
              config = {
                  "log": {"access": "", "error": "", "loglevel": "warning"},
                  "dns": {
                      "servers": ["https://1.1.1.1/dns-query", "https://1.0.0.1/dns-query"],
                      "queryStrategy": "UseIPv4"
                  },
                  "inbounds": [
                      {
                          "tag": "socks",
                          "port": 10808,
                          "listen": "127.0.0.1",
                          "protocol": "socks",
                          "settings": {"udp": True, "auth": "noauth"}
                      },
                      {
                          "tag": "http",
                          "port": 10809,
                          "listen": "127.0.0.1",
                          "protocol": "http",
                          "settings": {"auth": "noauth"}
                      }
                  ],
                  "outbounds": final_outbounds,
                  "routing": {
                      "domainStrategy": "AsIs",
                      "rules": rules,
                      "balancers": balancers
                  },
                  "burstObservatory": {
                      "pingConfig": {
                          "timeout": "3s",
                          "interval": "30s",
                          "sampling": 2,
                          "destination": "http://www.gstatic.com/generate_204"
                      },
                      "subjectSelector": ["srv-"] # Monitor all our servers
                  }
              }
              
              with open("config.json", "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2, ensure_ascii=False)
                  
              print(f"Generated config.json with {len(normal_outbounds)} normal and {len(lte_outbounds)} LTE servers.")

          if __name__ == "__main__":
              process_vless_aggregator()
          EOF
          python3 parser.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add config.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Auto-update: Refreshed VLESS JSON configs"
            git push
          fi
