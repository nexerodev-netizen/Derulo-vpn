name: Aggregate hello-team subs JSON

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  aggregate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip > /dev/null 2>&1

      - name: Generate Config
        run: |
          pip install requests > /dev/null 2>&1
          
          cat << 'PYEOF' > gen.py
          import requests
          import urllib.parse
          import json
          import re
          import socket
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          SOURCES = [
              "https://cdn.jsdelivr.net/gh/luxxuria/harvester@main/ping_tested.txt",
              "https://raw.githubusercontent.com/bobrinaw/vlessforu/refs/heads/main/working_configs.txt"
          ]

          # Карта флагов для определения страны
          FLAG_MAP = {
              "DE": "🇩🇪", "NL": "🇳🇱", "FR": "🇫🇷", "US": "🇺🇸", "GB": "🇬🇧", 
              "RU": "🇷🇺", "JP": "🇯🇵", "SG": "🇸🇬", "KR": "🇰🇷", "CA": "🇨🇦",
              "AU": "🇦🇺", "BR": "🇧🇷", "IN": "🇮🇳", "IT": "🇮🇹", "ES": "🇪🇸",
              "PL": "🇵🇱", "SE": "🇸🇪", "NO": "🇳🇴", "DK": "🇩🇰", "CH": "🇨🇭",
              "AT": "🇦🇹", "BE": "🇧🇪", "PT": "🇵🇹", "IE": "🇮🇪", "CZ": "🇨🇿",
              "RO": "🇷🇴", "HU": "🇭🇺", "GR": "🇬🇷", "BG": "🇧🇬", "HR": "🇭🇷",
              "SK": "🇸🇰", "SI": "🇸🇮", "LT": "🇱🇹", "LV": "🇱🇻", "EE": "🇪🇪",
              "UA": "🇺🇦", "MD": "🇲🇩", "RS": "🇷🇸", "BA": "🇧🇦", "ME": "🇲🇪",
              "MK": "🇲🇰", "AL": "🇦🇱", "IL": "🇮🇱", "TR": "🇹🇷", "AE": "🇦🇪",
              "SA": "🇸🇦", "QA": "🇶🇦", "KW": "🇰🇼", "OM": "🇴🇲", "BH": "🇧🇭",
              "JO": "🇯🇴", "LB": "🇱🇧", "TH": "🇹🇭", "VN": "🇻🇳", "MY": "🇲🇾",
              "ID": "🇮🇩", "PH": "🇵🇭", "TW": "🇹🇼", "HK": "🇭🇰", "ZA": "🇿🇦",
              "NG": "🇳🇬", "KE": "🇰🇪", "AR": "🇦🇷", "CL": "🇨🇱", "CO": "🇨🇴",
              "PE": "🇵🇪", "MX": "🇲🇽", "FI": "🇫🇮"
          }

          def has_flag(text):
              return bool(re.search(r'[\U0001F1E6-\U0001F1FF]{2}', text))

          def get_flag_from_name(name):
              match = re.search(r'([\U0001F1E6-\U0001F1FF]{2})', name)
              return match.group(1) if match else "🏳️"

          def detect_country_code(name):
              # Простая эвристика по названию, если флага нет, но тут мы полагаемся на флаг
              return None

          def check_port_alive(address, port, timeout=2):
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(timeout)
                  result = sock.connect_ex((address, port))
                  sock.close()
                  return result == 0
              except:
                  return False

          def parse_vless(line):
              try:
                  if '#' in line:
                      base_part, fragment = line.rsplit('#', 1)
                      original_name = urllib.parse.unquote(fragment)
                  else:
                      return None
                  
                  if not has_flag(original_name):
                      return None

                  body = base_part[8:]
                  user_host, _, rest = body.partition('@')
                  uuid_val = user_host
                  host_params, _, _ = rest.partition('#')
                  address_port, _, query_string = host_params.partition('?')
                  address, port_str = address_port.split(':')
                  port = int(port_str)
                  
                  params = dict(urllib.parse.parse_qsl(query_string))
                  
                  is_lte = "LTE" in original_name.upper()
                  
                  # Определяем страну по флагу в имени
                  flag = get_flag_from_name(original_name)
                  # Находим код страны по флагу (обратный поиск)
                  cc = None
                  for code, f in FLAG_MAP.items():
                      if f == flag:
                          cc = code
                          break
                  if not cc: cc = "XX"

                  outbound = {
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": address,
                              "port": port,
                              "users": [{"id": uuid_val, "encryption": "none", "flow": params.get('flow', '')}]
                          }]
                      },
                      "streamSettings": {
                          "network": params.get('type', 'tcp'),
                          "security": params.get('security', 'none')
                      }
                  }
                  
                  # Добавляем TLS/Reality
                  sec = params.get('security', 'none')
                  if sec == 'reality':
                      outbound["streamSettings"]["realitySettings"] = {
                          "serverName": params.get('sni', ''),
                          "publicKey": params.get('pbk', ''),
                          "shortId": params.get('sid', ''),
                          "fingerprint": params.get('fp', 'random')
                      }
                  elif sec == 'tls':
                      outbound["streamSettings"]["tlsSettings"] = {
                          "serverName": params.get('sni', address),
                          "fingerprint": params.get('fp', 'random')
                      }
                      
                  # Transport
                  net = params.get('type', 'tcp')
                  if net == 'ws':
                      outbound["streamSettings"]["wsSettings"] = {
                          "path": params.get('path', '/'),
                          "headers": {"Host": params.get('host', '')}
                      }
                  elif net == 'grpc':
                      outbound["streamSettings"]["grpcSettings"] = {
                          "serviceName": params.get('serviceName', '')
                      }

                  return {
                      "outbound": outbound,
                      "is_lte": is_lte,
                      "original_name": original_name,
                      "flag": flag,
                      "cc": cc,
                      "address": address,
                      "port": port
                  }
              except Exception as e:
                  return None

          def process():
              all_servers = []
              print("Fetching sources...")
              for url in SOURCES:
                  try:
                      r = requests.get(url, timeout=10)
                      for line in r.text.splitlines():
                          line = line.strip()
                          if line.startswith("vless://"):
                              parsed = parse_vless(line)
                              if parsed:
                                  all_servers.append(parsed)
                  except: pass

              print(f"Parsed {len(all_servers)} servers. Probing ports...")
              
              valid_servers = []
              with ThreadPoolExecutor(max_workers=50) as executor:
                  futures = {}
                  for s in all_servers:
                      futures[executor.submit(check_port_alive, s['address'], s['port'])] = s
                  
                  for f in as_completed(futures):
                      s = futures[f]
                      if f.result():
                          valid_servers.append(s)
                          
              print(f"Valid servers: {len(valid_servers)}")
              
              # Группировка
              outbounds = []
              balancers = []
              country_tags = {} # cc -> [tags]
              lte_tags = []
              normal_tags = []
              
              # Теги для стран
              country_counter = {}

              for idx, s in enumerate(valid_servers):
                  tag = f"srv-{idx}"
                  ob = s["outbound"]
                  ob["tag"] = tag
                  outbounds.append(ob)
                  
                  if s["is_lte"]:
                      # LTE оставляем с оригинальным именем
                      # Но тег уже присвоен выше. Чтобы в клиенте отображалось имя, 
                      # некоторые клиенты используют tag, другие remarks. 
                      # В Xray core имя берется из tag.
                      # Мы перезапишем tag на оригинальное имя для LTE, чтобы оно сохранилось
                      ob["tag"] = s["original_name"] 
                      lte_tags.append(s["original_name"])
                  else:
                      # Обычные переименовываем
                      new_name = f"Hello team❤️ {s['flag']}"
                      ob["tag"] = new_name
                      normal_tags.append(new_name)
                      
                      if s["cc"] not in country_tags:
                          country_tags[s["cc"]] = []
                      country_tags[s["cc"]].append(new_name)

              # Создаем Balancer для Авто-выбора (только обычные)
              if normal_tags:
                  balancers.append({
                      "tag": "⚡ Auto Select",
                      "selector": ["Hello team❤️"], # Выбирает все теги, начинающиеся с этой фразы
                      "strategy": {"type": "leastPing"},
                      "fallbackTag": normal_tags[0] if normal_tags else "direct"
                  })

              # Создаем Balancers для стран
              for cc, tags in country_tags.items():
                  flag = FLAG_MAP.get(cc, "🏳️")
                  balancers.append({
                      "tag": f"📍 Country {flag}",
                      "selector": tags,
                      "strategy": {"type": "leastPing"}
                  })
                  
              # Создаем Balancer для LTE
              if lte_tags:
                  balancers.append({
                      "tag": "🚀 LTE Servers",
                      "selector": lte_tags,
                      "strategy": {"type": "leastPing"}
                  })

              # Финальная сборка JSON
              config = {
                  "log": {"access": "", "error": "", "loglevel": "warning"},
                  "dns": {
                      "servers": ["https://1.1.1.1/dns-query", "https://1.0.0.1/dns-query"],
                      "queryStrategy": "UseIPv4"
                  },
                  "inbounds": [
                      {"tag": "socks", "port": 10808, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}},
                      {"tag": "http", "port": 10809, "listen": "127.0.0.1", "protocol": "http"}
                  ],
                  "outbounds": outbounds + [
                      {"tag": "direct", "protocol": "freedom"},
                      {"tag": "block", "protocol": "blackhole"},
                      {"tag": "dns-out", "protocol": "dns"}
                  ],
                  "routing": {
                      "domainStrategy": "AsIs",
                      "rules": [
                          {"port": "53", "network": "tcp,udp", "outboundTag": "dns-out"},
                          {"ip": ["geoip:private"], "outboundTag": "direct"},
                          {"network": "tcp,udp", "balancerTag": "⚡ Auto Select"}
                      ],
                      "balancers": balancers
                  },
                  "burstObservatory": {
                      "pingConfig": {
                          "timeout": "3s",
                          "interval": "30s",
                          "sampling": 2,
                          "destination": "http://www.gstatic.com/generate_204"
                      },
                      "subjectSelector": ["srv-", "Hello team❤️"] # Мониторим и те и другие
                  },
                  "remarks": "Hello Team Aggregator"
              }
              
              with open("config.json", "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2, ensure_ascii=False)
              print("Done! config.json created.")

          if __name__ == "__main__":
              process()
          PYEOF
          
          python3 gen.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --staged --quiet || git commit -m "chore: update config.json $(date -u +%H:%M)"
          git push
