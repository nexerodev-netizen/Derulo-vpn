name: Aggregate VLESS to JSON (No TCP Check)

on:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов
  workflow_dispatch:

jobs:
  aggregate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl jq > /dev/null 2>&1

      - name: Fetch, Parse & Save JSON
        run: |
          mkdir -p public
          python3 - <<'PYEOF'
          import base64, re, sys, json, socket, time, os
          from urllib.parse import quote, unquote
          import urllib.request
          from collections import defaultdict

          # === ИСТОЧНИКИ (из второго кода) ===
          SOURCES = [
              "https://cdn.jsdelivr.net/gh/luxxuria/harvester@main/ping_tested.txt",
              "https://raw.githubusercontent.com/bobrinaw/vlessforu/refs/heads/main/working_configs.txt"
          ]

          def parse_lines(text):
              """Парсит строки vless://, извлекает базу и хеш (имя)"""
              out = []
              for line in text.strip().split("\n"):
                  line = line.strip()
                  if not line or line.startswith("#"): continue
                  # Регулярка как в первом коде, но адаптирована под vless
                  m = re.match(r"(vless)://([^@]+)@([^:/?]+):(\d+)([^#]*)(#.*)?", line)
                  if m:
                      out.append({
                          "raw_base": f"{m.group(1)}://{m.group(2)}@{m.group(3)}:{m.group(4)}{m.group(5)}",
                          "host": m.group(3), 
                          "port": int(m.group(4)), 
                          "old_hash": m.group(6) or "", # Это закодированное имя
                      })
              return out

          def resolve_and_filter(servers):
              """Проверяет DNS, чтобы убедиться, что сервер хоть как-то существует, но НЕ делает TCP connect"""
              resolved = []
              for s in servers:
                  try: 
                      ip = socket.gethostbyname(s["host"])
                      s["ip"] = ip
                      resolved.append(s)
                  except: 
                      pass # Пропускаем те, что вообще не резолвятся
              return resolved

          # ====== ЗАГРУЗКА ======
          
          print("Fetching sources...")
          all_raw_servers = []
          
          for url in SOURCES:
              try:
                  print(f"  Loading: {url}")
                  resp = urllib.request.urlopen(url, timeout=15)
                  raw = resp.read().decode("utf-8")
                  # Источники во втором коде были plain text, не base64
                  all_raw_servers.extend(parse_lines(raw))
              except Exception as e: 
                  print(f"  Error loading {url}: {e}")

          # Удаляем дубликаты по raw_base
          seen = set()
          unique_servers = []
          for s in all_raw_servers:
              if s["raw_base"] not in seen:
                  seen.add(s["raw_base"])
                  unique_servers.append(s)
          
          print(f"Unique servers found: {len(unique_servers)}")
          
          # Резолвим DNS (быстрая проверка валидности хоста)
          print("Resolving DNS (no TCP check)...")
          valid_servers = resolve_and_filter(unique_servers)
          print(f"Valid hosts: {len(valid_servers)}")

          # ====== ФОРМИРОВАНИЕ СПИСКОВ ======
          
          all_entries = []
          lte_entries = []

          for s in valid_servers:
              # Декодируем оригинальное имя
              original_name = ""
              if s["old_hash"]:
                  try:
                      # Убираем символ # в начале если он есть, и декодируем
                      name_part = s["old_hash"].lstrip("#")
                      original_name = unquote(name_part)
                  except:
                      original_name = "Unknown"
              
              # Полная ссылка для подключения
              full_link = f"{s['raw_base']}#{quote(original_name)}"

              entry = {
                  "link": full_link,
                  "name": original_name,
                  "ip": s.get("ip", ""),
                  "port": s["port"]
              }

              # Добавляем в общий список
              all_entries.append(entry)

              # Если в имени есть LTE -> добавляем в список LTE
              if "LTE" in original_name.upper():
                  lte_entries.append(entry)

          # ====== ЗАПИСЬ В JSON ======
          
          output_data = {
              "meta": {
                  "generated_at": time.strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "total_all": len(all_entries),
                  "total_lte": len(lte_entries),
                  "sources": SOURCES
              },
              "all_servers": all_entries,
              "lte_servers": lte_entries
          }

          os.makedirs("public", exist_ok=True)
          with open("public/vless_data.json", "w", encoding="utf-8") as f:
              json.dump(output_data, f, indent=2, ensure_ascii=False)

          print(f"\nDone! Saved to public/vless_data.json")
          print(f"Total: {len(all_entries)}, LTE: {len(lte_entries)}")
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/vless_data.json
          git pull --rebase origin main || true
          git diff --staged --quiet || git commit -m "chore: update vless json $(date -u +%Y-%m-%dT%H:%M)"
          git push
