name: Aggregate All & LTE to JSON

on:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов
  workflow_dispatch:

jobs:
  aggregate-vless-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Parse VLESS (No TCP Check, Keep Original Names)
        run: |
          cat << 'PYEOF' > parser.py
          import requests
          import urllib.parse
          import json
          import time

          # Источники
          SOURCES = [
              "https://cdn.jsdelivr.net/gh/luxxuria/harvester@main/ping_tested.txt",
              "https://raw.githubusercontent.com/bobrinaw/vlessforu/refs/heads/main/working_configs.txt"
          ]

          def has_flag_emoji(text):
              """Проверка наличия флага для фильтрации мусора"""
              for char in text:
                  if '\U0001F1E6' <= char <= '\U0001F1FF':
                      return True
              return False

          def process_vless():
              all_servers = []
              lte_servers = []
              seen_links = set()
              
              print("Starting aggregation without TCP check...")
              
              for url in SOURCES:
                  try:
                      print(f"Fetching: {url}")
                      response = requests.get(url, timeout=15)
                      response.raise_for_status()
                      lines = response.text.splitlines()
                      
                      for line in lines:
                          line = line.strip()
                          if not line.startswith("vless://"):
                              continue
                          
                          try:
                              # Парсинг имени
                              if '#' not in line:
                                  continue
                                  
                              base_part, fragment = line.rsplit('#', 1)
                              original_name = urllib.parse.unquote(fragment)
                              
                              # Фильтр: оставляем только строки с флагами (чтобы убрать мусор)
                              if not has_flag_emoji(original_name):
                                  continue

                              # Проверка на дубликаты по базовой ссылке
                              if base_part in seen_links:
                                  continue
                              seen_links.add(base_part)

                              # Объект сервера с ОРИГИНАЛЬНЫМ именем
                              server_obj = {
                                  "link": line,
                                  "name": original_name,
                                  "source": url
                              }

                              # Добавляем в общий список
                              all_servers.append(server_obj)

                              # Если в имени есть LTE -> добавляем в отдельный список LTE
                              if "LTE" in original_name.upper():
                                  lte_servers.append(server_obj)
                              
                          except Exception:
                              continue
                              
                  except Exception as e:
                      print(f"Source error {url}: {e}")

              # Формируем итоговый JSON
              output_data = {
                  "meta": {
                      "generated_at": time.strftime("%Y-%m-%d %H:%M:%S UTC"),
                      "total_all": len(all_servers),
                      "total_lte": len(lte_servers),
                      "note": "Names are preserved from source. No TCP check performed."
                  },
                  "all_servers": all_servers,
                  "lte_servers": lte_servers
              }

              # Запись в файл
              with open("vless_data.json", "w", encoding="utf-8") as f:
                  json.dump(output_data, f, indent=2, ensure_ascii=False)

              print(f"Done! Total: {len(all_servers)}, LTE: {len(lte_servers)}")

          if __name__ == "__main__":
              process_vless()
          PYEOF
          
          python3 parser.py

      - name: Commit and Push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add vless_data.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Auto-update: Refreshed VLESS JSON (All + LTE)"
            git push
          fi
