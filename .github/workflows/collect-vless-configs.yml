name: Check VLESS Configs

on:
  workflow_dispatch: # Ручной запуск
  schedule:
    - cron: "*/30 * * * *" # Автоматический запуск каждые 30 минут

permissions:
  contents: write # Разрешение на запись файлов в репозиторий

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xray Core
        run: |
          echo "Installing latest Xray Core..."
          VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Version: $VERSION"
          
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
          mkdir -p /tmp/xray-bin
          unzip -q /tmp/xray.zip -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
          echo "Xray installed at /tmp/xray-bin/xray"

      - name: Create and Run Checker Script
        run: |
          cat > check_configs.py << 'PYTHON_SCRIPT'
          import json
          import os
          import re
          import socket
          import subprocess
          import tempfile
          import time
          from urllib.parse import urlparse, parse_qs
          import requests

          # Источник конфигов
          SOURCE_URL = "https://sub.vlessfo.ru/vlessforu/working_configs.txt"
          OUTPUT_FILE = "configs.txt"
          XRAY_BIN = "/tmp/xray-bin/xray"
          
          LOCAL_SOCKS_PORT = 10808
          START_TIMEOUT = 5
          REQUEST_TIMEOUT = 8

          def get_vless_links():
              try:
                  r = requests.get(SOURCE_URL, timeout=20)
                  r.raise_for_status()
                  lines = r.text.splitlines()
                  
                  unique_links = []
                  seen = set()
                  
                  for line in lines:
                      line = line.strip()
                      # Исправляем возможные опечатки vless:://
                      line = re.sub(r"^vless:://", "vless://", line)
                      
                      if line.startswith("vless://") and line not in seen:
                          unique_links.append(line)
                          seen.add(line)
                          
                  return unique_links
              except Exception as e:
                  print(f"Error fetching source: {e}")
                  return []

          def build_xray_config(uri):
              parsed = urlparse(uri)
              host = parsed.hostname
              port = parsed.port or 443
              uuid = parsed.username
              
              if not host or not uuid:
                  raise ValueError("Invalid URI: missing host or uuid")

              params = parse_qs(parsed.query)
              
              network = params.get("type", ["tcp"])[0]
              security = params.get("security", ["none"])[0]
              flow = params.get("flow", [""])[0]
              
              stream_settings = {
                  "network": network,
                  "security": security,
              }

              # Настройки TLS
              if security == "tls":
                  sni = params.get("sni", [host])[0]
                  stream_settings["tlsSettings"] = {
                      "serverName": sni,
                      "allowInsecure": False
                  }

              # Настройки Reality
              elif security == "reality":
                  sni = params.get("sni", [host])[0]
                  pbk = params.get("pbk", [""])[0]
                  sid = params.get("sid", [""])[0]
                  fp = params.get("fp", ["chrome"])[0]
                  
                  stream_settings["realitySettings"] = {
                      "serverName": sni,
                      "publicKey": pbk,
                      "shortId": sid,
                      "fingerprint": fp,
                      "show": False
                  }

              # Настройки WebSocket
              if network == "ws":
                  path = params.get("path", ["/"])[0]
                  ws_host = params.get("host", [host])[0]
                  stream_settings["wsSettings"] = {
                      "path": path,
                      "headers": {"Host": ws_host}
                  }

              # Настройки gRPC
              elif network == "grpc":
                  service_name = params.get("serviceName", [""])[0]
                  stream_settings["grpcSettings"] = {
                      "serviceName": service_name
                  }

              config = {
                  "log": {"loglevel": "error"},
                  "inbounds": [{
                      "port": LOCAL_SOCKS_PORT,
                      "listen": "127.0.0.1",
                      "protocol": "socks",
                      "settings": {"udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": host,
                              "port": port,
                              "users": [{
                                  "id": uuid,
                                  "encryption": "none",
                                  "flow": flow
                              }]
                          }]
                      },
                      "streamSettings": stream_settings
                  }]
              }
              return config

          def test_proxy_connection():
              proxies = {
                  "http": f"socks5h://127.0.0.1:{LOCAL_SOCKS_PORT}",
                  "https": f"socks5h://127.0.0.1:{LOCAL_SOCKS_PORT}",
              }
              try:
                  # Используем легкий эндпоинт Cloudflare
                  r = requests.get("https://www.cloudflare.com/cdn-cgi/trace", proxies=proxies, timeout=REQUEST_TIMEOUT)
                  return r.status_code == 200
              except:
                  return False

          def check_single_config(uri):
              config_data = build_xray_config(uri)
              
              # Создаем временный файл конфига
              fd, config_path = tempfile.mkstemp(suffix=".json")
              with os.fdopen(fd, 'w') as f:
                  json.dump(config_data, f)

              proc = None
              try:
                  # Запускаем Xray
                  proc = subprocess.Popen(
                      [XRAY_BIN, "run", "-c", config_path],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  # Ждем открытия порта
                  start_time = time.time()
                  connected = False
                  while time.time() - start_time < START_TIMEOUT:
                      try:
                          with socket.create_connection(("127.0.0.1", LOCAL_SOCKS_PORT), timeout=0.5):
                              connected = True
                              break
                      except OSError:
                          time.sleep(0.2)

                  if not connected:
                      return False

                  # Проверяем интернет через прокси
                  return test_proxy_connection()

              except Exception as e:
                  print(f"Check error: {e}")
                  return False
              finally:
                  if proc:
                      try:
                          proc.terminate()
                          proc.wait(timeout=2)
                      except:
                          proc.kill()
                  if os.path.exists(config_path):
                      os.remove(config_path)

          def main():
              print("Fetching links...")
              links = get_vless_links()
              print(f"Found {len(links)} unique links.")

              working_links = []
              
              for i, link in enumerate(links):
                  print(f"[{i+1}/{len(links)}] Checking...", end=" ")
                  if check_single_config(link):
                      print("OK")
                      working_links.append(link)
                  else:
                      print("FAIL")

              # Сохраняем результат
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  for link in working_links:
                      f.write(link + "\n")

              print(f"\nDone! Working: {len(working_links)}/{len(links)}")

          if __name__ == "__main__":
              main()
          PYTHON_SCRIPT

          python3 -m pip install requests -q
          python3 check_configs.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add configs.txt
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update working VLESS configs"
            git push
          fi
