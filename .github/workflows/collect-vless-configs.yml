name: Update VLESS Aggregator

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Process and Rename Servers
        run: |
          python3 << 'EOF'
          import urllib.request
          from urllib.parse import quote

          URL = "https://sub.vlessfo.ru/vlessforu/working_configs.txt"
          OUTPUT = "working_configs.txt"
          
          # Новый заголовок профиля
          NEW_TITLE = "# profile-title: Платный впн"
          
          # Текст для announce, который мы добавим в имя
          ANNOUNCE_TEXT = "🔥 Серверов: 182 | Обновлено: 09.10.2026 11:02 | Обязательно подпишитесь на VlessForu❤️ в Телеграме! | ⚠️ LTE/5G для крайних случаев! Без торрентов! | 🚀 Top: ~2891.4 Mbps, ~177 ms"
          
          BASE_NAME = "Платный впн"
          LTE_TAG = "LTE"

          def fetch():
              try:
                  with urllib.request.urlopen(URL) as resp:
                      return resp.read().decode('utf-8').splitlines()
              except Exception as e:
                  print(f"Error: {e}")
                  return []

          def process_line(line):
              line = line.strip()
              
              # Пропускаем все старые служебные комментарии (#...)
              if not line or line.startswith('#'):
                  return None
                  
              if not line.startswith("vless://"):
                  return None

              # Разделяем базу и фрагмент (имя)
              if '#' in line:
                  base, fragment = line.split('#', 1)
              else:
                  base, fragment = line, ""

              # Если есть LTE, оставляем как есть (возвращаем оригинальную строку)
              if LTE_TAG in fragment:
                  return line
              
              # Формируем новое имя: Базовое имя + Announce
              # Кодируем в URL format, чтобы спецсимволы не ломали ссылку
              full_name = f"{BASE_NAME} | {ANNOUNCE_TEXT}"
              new_fragment = quote(full_name)
              
              return f"{base}#{new_fragment}"

          lines = fetch()
          processed = []
          
          for l in lines:
              res = process_line(l)
              if res:
                  processed.append(res)

          # Собираем итоговый файл: Только новый заголовок + серверы
          content = NEW_TITLE + "\n" + "\n".join(processed)
          
          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write(content)
          
          print(f"Done. Processed {len(processed)} servers.")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add working_configs.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update: clean headers, added announce to name" && git push)
