name: Check my VLESS nodes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xray
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(curl -fsSL \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest |
            python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')"

          curl -fsSL \
            "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

          /tmp/xray/xray version

      - name: Create checker
        shell: bash
        run: |
          cat > check.py <<'PY'
          import json
          import os
          import re
          import socket
          import subprocess
          import tempfile
          import time
          from urllib.parse import urlparse, parse_qs

          import requests

          SOURCE = "https://sub.vlessfo.ru/vlessforu/working_configs.txt"
          XRAY = "/tmp/xray/xray"
          OUT = "configs.txt"

          LOCAL_PORT = 18080
          START_TIMEOUT = 7
          TEST_TIMEOUT = 10

          def get_configs():
              r = requests.get(SOURCE, timeout=20)
              r.raise_for_status()

              result = []

              for raw in r.text.splitlines():
                  uri = raw.strip()

                  # исправляет vless:://
                  uri = re.sub(r"^vless:://", "vless://", uri)

                  if uri.startswith("vless://"):
                      result.append(uri)

              return list(dict.fromkeys(result))

          def q1(q, name, default=None):
              return q.get(name, [default])[0]

          def make_config(uri):
              p = urlparse(uri)

              host = p.hostname
              if not host:
                  raise ValueError("no host")

              host = host.lower()

              uuid = p.username
              if not uuid:
                  raise ValueError("no UUID")

              port = p.port or 443
              q = parse_qs(p.query)

              network = q1(q, "type", "tcp")
              security = q1(q, "security", "none")

              stream = {
                  "network": network,
                  "security": security
              }

              # TLS
              if security == "tls":
                  stream["tlsSettings"] = {
                      "serverName": q1(q, "sni", host),
                      "alpn": q.get("alpn", [])
                  }

              # REALITY
              elif security == "reality":
                  reality = {
                      "serverName": q1(q, "sni", host),
                      "publicKey": q1(q, "pbk"),
                      "shortId": q1(q, "sid", ""),
                      "fingerprint": q1(q, "fp", "chrome")
                  }

                  if not reality["publicKey"]:
                      raise ValueError("REALITY public key (pbk) missing")

                  stream["realitySettings"] = reality

              # WebSocket
              if network == "ws":
                  headers = {}

                  ws_host = q1(q, "host")
                  if ws_host:
                      headers["Host"] = ws_host

                  stream["wsSettings"] = {
                      "path": q1(q, "path", "/"),
                      "headers": headers
                  }

              # gRPC
              elif network == "grpc":
                  stream["grpcSettings"] = {
                      "serviceName": q1(q, "serviceName", ""),
                      "multiMode": q1(q, "mode", "") == "multi"
                  }

              # HTTP/2
              elif network in ("h2", "http"):
                  stream["httpSettings"] = {
                      "path": q1(q, "path", "/"),
                      "host": q.get("host", [])
                  }

              # XHTTP
              elif network == "xhttp":
                  stream["xhttpSettings"] = {
                      "path": q1(q, "path", "/"),
                      "host": q1(q, "host", "")
                  }

              # TCP
              elif network in ("tcp", "raw"):
                  stream["network"] = "raw"

              # unknown transport — don't guess
              elif network not in ("quic",):
                  raise ValueError(
                      f"unsupported VLESS transport: {network}"
                  )

              user = {
                  "id": uuid,
                  "encryption": q1(q, "encryption", "none")
              }

              flow = q1(q, "flow")
              if flow:
                  user["flow"] = flow

              return {
                  "log": {
                      "loglevel": "error"
                  },
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": LOCAL_PORT,
                      "protocol": "socks",
                      "settings": {
                          "udp": False
                      }
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": host,
                              "port": port,
                              "users": [user]
                          }]
                      },
                      "streamSettings": stream
                  }]
              }

          def wait_for_port():
              deadline = time.time() + START_TIMEOUT

              while time.time() < deadline:
                  try:
                      with socket.create_connection(
                          ("127.0.0.1", LOCAL_PORT),
                          timeout=0.3
                      ):
                          return True
                  except OSError:
                      time.sleep(0.2)

              return False

          def check(uri):
              config = make_config(uri)

              fd, filename = tempfile.mkstemp(
                  prefix="xray-",
                  suffix=".json"
              )

              proc = None

              try:
                  with os.fdopen(fd, "w") as f:
                      json.dump(config, f)

                  proc = subprocess.Popen(
                      [XRAY, "run", "-c", filename],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  if not wait_for_port():
                      return False

                  proxies = {
                      "http":
                          f"socks5h://127.0.0.1:{LOCAL_PORT}",
                      "https":
                          f"socks5h://127.0.0.1:{LOCAL_PORT}"
                  }

                  r = requests.get(
                      "https://www.cloudflare.com/cdn-cgi/trace",
                      proxies=proxies,
                      timeout=TEST_TIMEOUT
                  )

                  return r.status_code == 200

              finally:
                  if proc:
                      proc.terminate()

                      try:
                          proc.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          proc.kill()

                  try:
                      os.remove(filename)
                  except FileNotFoundError:
                      pass

          def main():
              configs = get_configs()

              print("Total:", len(configs))

              working = []

              for i, uri in enumerate(configs, 1):
                  try:
                      host = urlparse(uri).hostname
                      print(f"[{i}/{len(configs)}] {host}")

                      if check(uri):
                          print("  OK")
                          working.append(uri)
                      else:
                          print("  FAIL")

                  except Exception as e:
                      print("  ERROR:", e)

              with open(OUT, "w", encoding="utf-8") as f:
                  for uri in working:
                      f.write(uri + "\n")

              print()
              print(f"Working: {len(working)}/{len(configs)}")

          if __name__ == "__main__":
              main()
          PY

      - name: Run checks
        run: |
          python3 -m pip install --disable-pip-version-check requests
          python3 check.py

      - name: Commit configs.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add configs.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update working VLESS configs"
            git push
          fi
