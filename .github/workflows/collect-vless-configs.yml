name: Update VLESS Aggregator

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Process and Rename Servers
        run: |
          python3 << 'EOF'
          import urllib.request
          from urllib.parse import quote
          import json

          URL = "https://sub.vlessfo.ru/vlessforu/working_configs.txt"
          OUTPUT = "working_configs.txt"

          HEADER_TITLE = "# profile-title: Платный впн"
          HEADER_ANNOUNCE = "# announce: 🔥 Серверов: 182 | Обновлено: 09.10.2026 11:02 | ⚠️ LTE/5G для крайних случаев! Без торрентов! | 🚀 Top: ~2891.4 Mbps, ~177 ms"

          SERVER_PREFIX = "Сервер #"
          LTE_TAG = "LTE"

          def fetch():
              try:
                  with urllib.request.urlopen(URL) as resp:
                      return resp.read().decode('utf-8').splitlines()
              except Exception as e:
                  print(f"Error: {e}")
                  return []

          lines = fetch()
          processed = []
          counter = 1

          for line in lines:
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              if not line.startswith("vless://"):
                  continue

              if '#' in line:
                  base, fragment = line.split('#', 1)
              else:
                  base, fragment = line, ""

              if LTE_TAG in fragment:
                  processed.append(line)
              else:
                  new_name = f"{SERVER_PREFIX}{counter}"
                  new_fragment = quote(new_name)
                  processed.append(f"{base}#{new_fragment}")
                  counter += 1

          content = f"{HEADER_TITLE}\n{HEADER_ANNOUNCE}\n\n" + "\n".join(processed)
          
          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write(content)
              
          # Сохраняем контент в отдельный файл для отправки в Gist
          with open("gist_content.txt", "w", encoding="utf-8") as f:
              f.write(content)
              
          print(f"Done. Renamed {counter - 1} servers.")
          EOF

      - name: Commit to Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add working_configs.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update: clean announce, numbered non-LTE servers" && git push)

      - name: Auto-Sync to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "Error: GIST_TOKEN secret is not set."
            exit 1
          fi

          python3 << 'PYEOF'
          import os
          import json
          import urllib.request

          TOKEN = os.environ['GIST_TOKEN']
          FILENAME = "working_configs.txt"
          
          # Читаем содержимое
          with open("gist_content.txt", "r", encoding="utf-8") as f:
              content = f.read()

          headers = {
              "Authorization": f"token {TOKEN}",
              "Content-Type": "application/json",
              "Accept": "application/vnd.github.v3+json"
          }

          # 1. Ищем существующий Gist по имени файла
          # GitHub API не имеет прямого поиска по содержимому файлов гистов, 
          # но мы можем получить список всех гистов пользователя и найти нужный.
          req = urllib.request.Request("https://api.github.com/gists", headers=headers)
          response = urllib.request.urlopen(req)
          gists = json.loads(response.read().decode())

          gist_id = None
          for gist in gists:
              if FILENAME in gist.get('files', {}):
                  gist_id = gist['id']
                  break

          data = {
              "description": "Auto-updated VLESS Configs",
              "public": True,
              "files": {
                  FILENAME: {
                      "content": content
                  }
              }
          }

          if gist_id:
              # Обновляем существующий
              print(f"Updating existing Gist: {gist_id}")
              req = urllib.request.Request(
                  f"https://api.github.com/gists/{gist_id}",
                  data=json.dumps(data).encode(),
                  headers=headers,
                  method='PATCH'
              )
          else:
              # Создаем новый
              print("Creating new Gist...")
              req = urllib.request.Request(
                  "https://api.github.com/gists",
                  data=json.dumps(data).encode(),
                  headers=headers,
                  method='POST'
              )

          try:
              resp = urllib.request.urlopen(req)
              result = json.loads(resp.read().decode())
              print(f"Success! Gist URL: {result['html_url']}")
              # Опционально: можно сохранить ID в репо, чтобы не искать каждый раз, 
              # но поиск по списку гистов работает быстро, если их не тысячи.
          except Exception as e:
              print(f"Error updating Gist: {e}")
          PYEOF
