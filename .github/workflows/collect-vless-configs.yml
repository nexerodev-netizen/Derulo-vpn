name: Update VLESS Aggregator

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Process and Rename Servers
        run: |
          python3 << 'EOF'
          import urllib.request
          from urllib.parse import quote
          import time

          URL = "https://sub.vlessfo.ru/vlessforu/working_configs.txt"
          OUTPUT = "working_configs.txt"

          # Генерируем expire: текущее время + 100 лет (в секундах)
          EXPIRE_TIMESTAMP = int(time.time()) + (100 * 365 * 24 * 3600)

          HEADER_TITLE = "# profile-title: Платный впн"
          # upload=1GB, download=50GB, total=200GB
          HEADER_USERINFO = f"# subscription-userinfo: upload=1073741824; download=0; total=0; expire={EXPIRE_TIMESTAMP}"
          HEADER_ANNOUNCE = "# announce: 🔥 Серверов: 182 | Обновлено: 09.10.2026 11:02 | ⚠️ LTE/5G для крайних случаев! Без торрентов! | 🚀 Top: ~2891.4 Mbps, ~177 ms"

          SERVER_PREFIX = "Сервер #"
          LTE_TAG = "LTE"

          def fetch():
              try:
                  with urllib.request.urlopen(URL) as resp:
                      return resp.read().decode('utf-8').splitlines()
              except Exception as e:
                  print(f"Error fetching data: {e}")
                  return []

          lines = fetch()
          processed = []
          counter = 1

          for line in lines:
              line = line.strip()
              
              # Пропускаем старые заголовки и пустые строки
              if not line or line.startswith('#'):
                  continue
                  
              if not line.startswith("vless://"):
                  continue

              # Разделяем базу и фрагмент (имя)
              if '#' in line:
                  base, fragment = line.split('#', 1)
              else:
                  base, fragment = line, ""

              # Если есть LTE, оставляем как есть
              if LTE_TAG in fragment:
                  processed.append(line)
              else:
                  # Нумеруем только не-LTE серверы
                  new_name = f"{SERVER_PREFIX}{counter}"
                  new_fragment = quote(new_name)
                  processed.append(f"{base}#{new_fragment}")
                  counter += 1

          # Собираем итоговый файл с новой структурой заголовков
          content = (
              f"{HEADER_TITLE}\n"
              f"{HEADER_USERINFO}\n"
              f"{HEADER_ANNOUNCE}\n\n"
              + "\n".join(processed)
          )
          
          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write(content)
          
          print(f"Done. Expire set to {EXPIRE_TIMESTAMP}. Renamed {counter - 1} servers.")
          EOF

      - name: Commit and Push to Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add working_configs.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update: added userinfo, numbered non-LTE servers" && git push)
