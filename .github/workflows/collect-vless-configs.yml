name: Check my VLESS configs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Xray
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(curl -fsSL \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest |
            python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')"

          curl -fsSL \
            "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check "requests[socks]"

      - name: Create checker
        shell: bash
        run: |
          cat > check.py <<'PY'
          import json
          import os
          import socket
          import subprocess
          import tempfile
          import time
          from urllib.parse import urlparse, parse_qs

          import requests

          SOURCE = "configs-input.txt"
          OUTPUT = "configs.txt"
          XRAY = "/tmp/xray/xray"

          LOCAL_PORT = 18080
          START_TIMEOUT = 5
          REQUEST_TIMEOUT = 8

          def read_configs():
              with open(SOURCE, encoding="utf-8") as f:
                  return list(dict.fromkeys(
                      x.strip()
                      for x in f
                      if x.strip().startswith("vless://")
                  ))

          def make_config(uri):
              p = urlparse(uri)
              host = p.hostname

              if not host:
                  raise ValueError("missing host")

              if not p.username:
                  raise ValueError("missing UUID")

              q = parse_qs(p.query)
              network = q.get("type", ["tcp"])[0]
              security = q.get("security", ["none"])[0]

              stream = {
                  "network": network,
                  "security": security
              }

              if security == "tls":
                  stream["tlsSettings"] = {
                      "serverName": q.get("sni", [host])[0]
                  }

              if network == "ws":
                  stream["wsSettings"] = {
                      "path": q.get("path", ["/"])[0],
                      "headers": {
                          "Host": q.get("host", [host])[0]
                      }
                  }

              if network == "grpc":
                  stream["grpcSettings"] = {
                      "serviceName": q.get("serviceName", [""])[0]
                  }

              return {
                  "log": {"loglevel": "error"},
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": LOCAL_PORT,
                      "protocol": "socks",
                      "settings": {"udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "vless",
                      "settings": {
                          "vnext": [{
                              "address": host,
                              "port": p.port or 443,
                              "users": [{
                                  "id": p.username,
                                  "encryption": "none"
                              }]
                          }]
                      },
                      "streamSettings": stream
                  }]
              }

          def check(uri):
              config = make_config(uri)

              fd, filename = tempfile.mkstemp(suffix=".json")
              proc = None

              try:
                  with os.fdopen(fd, "w") as f:
                      json.dump(config, f)

                  proc = subprocess.Popen(
                      [XRAY, "run", "-c", filename],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  deadline = time.time() + START_TIMEOUT

                  while time.time() < deadline:
                      try:
                          with socket.create_connection(
                              ("127.0.0.1", LOCAL_PORT),
                              timeout=.3
                          ):
                              break
                      except OSError:
                          time.sleep(.2)
                  else:
                      return False

                  proxies = {
                      "http": f"socks5h://127.0.0.1:{LOCAL_PORT}",
                      "https": f"socks5h://127.0.0.1:{LOCAL_PORT}"
                  }

                  r = requests.get(
                      "https://www.cloudflare.com/cdn-cgi/trace",
                      proxies=proxies,
                      timeout=REQUEST_TIMEOUT
                  )

                  return r.ok

              finally:
                  if proc:
                      proc.terminate()
                      try:
                          proc.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          proc.kill()

                  try:
                      os.remove(filename)
                  except OSError:
                      pass

          working = []

          for i, uri in enumerate(read_configs(), 1):
              print(f"[{i}] checking")

              try:
                  if check(uri):
                      print("  OK")
                      working.append(uri)
                  else:
                      print("  FAIL")
              except Exception as e:
                  print("  ERROR:", e)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\n".join(working))

          print(f"Working: {len(working)}")
          PY

      - name: Check configs
        run: python3 check.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add configs.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update configs"
            git push
          fi
