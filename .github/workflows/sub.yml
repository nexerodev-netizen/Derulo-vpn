name: Filter VLESS Strict TCP-TLS Only

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  filter-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Filter VLESS List
        run: |
          SOURCE_URL="https://cdn.jsdelivr.net/gh/luxxuria/harvester@main/ping_tested.txt"
          OUTPUT_FILE="sub.txt"
          
          echo "📥 Скачивание списка..."
          curl -sSL "$SOURCE_URL" -o raw_list.txt
          
          echo "🧹 Точная фильтрация через Python..."
          python3 - << 'PYEOF'
          import sys

          blocked_patterns = [
              "VLESS / TCP / TLS",
              "VLESS / TCP"
          ]

          kept_lines = []
          removed_count = 0

          with open("raw_list.txt", "r", encoding="utf-8") as f:
              for line in f:
                  stripped = line.strip()
                  if not stripped:
                      continue
                  
                  # Проверяем, содержит ли строка один из заблокированных паттернов
                  is_blocked = False
                  for pattern in blocked_patterns:
                      if pattern in stripped:
                          is_blocked = True
                          break
                  
                  if is_blocked:
                      removed_count += 1
                  else:
                      kept_lines.append(stripped)

          with open("sub.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(kept_lines))

          print(f"✅ Удалено: {removed_count} серверов")
          print(f"✅ Осталось: {len(kept_lines)} серверов")
          PYEOF

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add sub.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: strict tcp/tls removal ($(date +'%Y-%m-%d %H:%M'))"
            git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
            echo "🚀 sub.txt обновлен!"
          else
            echo "ℹ️ Изменений нет"
          fi
